- name: binomial_values_use_one_logical_event_per_entity
  description: Physical retries collapse before a Binomial Metric becomes one per-Entity value, and events outside the Conversion Window or from another Event Definition do not count.
  parameters: "app_id=app_1&environment_id=env_prod&experiment_id=exp_1&run_id=run_1&metric_id=metric_signup&metric_type=binomial&event_definition_id=event_definition_signup&window_duration_ms=259200000&from_ts=2026-07-01%2000%3A00%3A00.000&to_ts=2026-07-09%2000%3A00%3A00.000"
  expected_http_status: 200
  expected_result: |
    {"targeting_key_hash":"tk_conflict","run_id":"run_1","metric_id":"metric_signup","metric_type":"binomial","value":0,"in_window":1}
    {"targeting_key_hash":"tk_control_snapshot","run_id":"run_1","metric_id":"metric_signup","metric_type":"binomial","value":1,"in_window":1}
    {"targeting_key_hash":"tk_edge","run_id":"run_1","metric_id":"metric_signup","metric_type":"binomial","value":0,"in_window":1}
    {"targeting_key_hash":"tk_null_variant","run_id":"run_1","metric_id":"metric_signup","metric_type":"binomial","value":0,"in_window":1}
    {"targeting_key_hash":"tk_straddle","run_id":"run_1","metric_id":"metric_signup","metric_type":"binomial","value":0,"in_window":1}
    {"targeting_key_hash":"tk_tail","run_id":"run_1","metric_id":"metric_signup","metric_type":"binomial","value":0,"in_window":1}
    {"targeting_key_hash":"tk_treatment_snapshot","run_id":"run_1","metric_id":"metric_signup","metric_type":"binomial","value":1,"in_window":1}
