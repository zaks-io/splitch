- name: binomial_pre_period_uses_real_metric_events
  description: A logical Metric Event inside the declared lookback and before first Exposure becomes one pre-period covariate.
  parameters: "app_id=app_1&environment_id=env_prod&experiment_id=exp_1&run_id=run_1&metric_id=metric_signup&event_definition_id=event_definition_signup&lookback_ms=86400000&from_ts=2026-06-29%2000%3A00%3A00.000&to_ts=2026-07-09%2000%3A00%3A00.000"
  expected_http_status: 200
  expected_result: |
    {"targeting_key_hash":"tk_control_snapshot","metric_id":"metric_signup","pre_period_value":1,"covariate_source":"pre_period"}
