- name: activation_gate_reanchors_the_conversion_window
  description: A gated Run excludes an event inside the post-Exposure window when it occurred before Activation, and retains the activated Entity with a zero value.
  parameters: "app_id=app_delayed&environment_id=env_prod&experiment_id=exp_delayed&run_id=run_delayed&activation_gated=1&metric_query_config=%5B%7B%22metric_id%22%3A%22metric_signup%22%2C%22metric_type%22%3A%22binomial%22%2C%22event_definition_id%22%3A%22event_definition_signup%22%2C%22window_duration_ms%22%3A900000%2C%22cuped_lookback_ms%22%3A86400000%7D%5D&from_ts=2026-07-05%2000%3A00%3A00.000&to_ts=2026-07-06%2000%3A00%3A00.000"
  expected_http_status: 200
  expected_result: |
    {"targeting_key_hash":"tk_delayed_convex","run_id":"run_delayed","metric_id":"metric_signup","metric_type":"binomial","value":0,"num_value":0,"denom_value":0,"in_window":1}
- name: ungated_run_keeps_the_exposure_anchor
  description: The same frozen Metric counts an event inside the post-Exposure window when the Run has no Activation gate.
  parameters: "app_id=app_delayed&environment_id=env_prod&experiment_id=exp_delayed&run_id=run_delayed&activation_gated=0&metric_query_config=%5B%7B%22metric_id%22%3A%22metric_signup%22%2C%22metric_type%22%3A%22binomial%22%2C%22event_definition_id%22%3A%22event_definition_signup%22%2C%22window_duration_ms%22%3A900000%2C%22cuped_lookback_ms%22%3A86400000%7D%5D&from_ts=2026-07-05%2000%3A00%3A00.000&to_ts=2026-07-06%2000%3A00%3A00.000"
  expected_http_status: 200
  expected_result: |
    {"targeting_key_hash":"tk_delayed_convex","run_id":"run_delayed","metric_id":"metric_signup","metric_type":"binomial","value":1,"num_value":0,"denom_value":0,"in_window":1}
- name: retention_shifted_horizon_includes_start_and_excludes_exclusive_end
  description: The production batch pipe counts a Retention event exactly at the shifted horizon start and drops one at the exclusive end, while keeping exposed Entities with no in-horizon events as zeros.
  parameters: "app_id=app_retention_bounds&environment_id=env_prod&experiment_id=exp_retention_bounds&run_id=run_retention_bounds&activation_gated=0&metric_query_config=%5B%7B%22metric_id%22%3A%22metric_d7%22%2C%22metric_type%22%3A%22retention%22%2C%22event_definition_id%22%3A%22event_definition_signup%22%2C%22window_offset_ms%22%3A86400000%2C%22window_duration_ms%22%3A86400000%2C%22cuped_lookback_ms%22%3A86400000%7D%5D&from_ts=2026-07-01%2000%3A00%3A00.000&to_ts=2026-07-04%2000%3A00%3A00.000"
  expected_http_status: 200
  expected_result: |
    {"targeting_key_hash":"tk_offset_before","run_id":"run_retention_bounds","metric_id":"metric_d7","metric_type":"retention","value":0,"num_value":0,"denom_value":0,"in_window":1}
    {"targeting_key_hash":"tk_offset_end","run_id":"run_retention_bounds","metric_id":"metric_d7","metric_type":"retention","value":0,"num_value":0,"denom_value":0,"in_window":1}
    {"targeting_key_hash":"tk_offset_end_inside","run_id":"run_retention_bounds","metric_id":"metric_d7","metric_type":"retention","value":1,"num_value":0,"denom_value":0,"in_window":1}
    {"targeting_key_hash":"tk_offset_start","run_id":"run_retention_bounds","metric_id":"metric_d7","metric_type":"retention","value":1,"num_value":0,"denom_value":0,"in_window":1}
- name: gated_retention_reanchors_the_shifted_horizon_to_activation
