- name: earliest_real_exposure_survives_retries_and_non_exposure_rows
  description: The earliest real Exposure wins; its physical retry, an earlier Activation, and Evaluation-only usage cannot move the timestamp.
  parameters: "app_id=app_status&environment_id=env_prod"
  expected_http_status: 200
  expected_result: |
    {"app_id":"app_status","environment_id":"env_prod","first_exposure_at":"2026-07-01 00:00:00.000"}
- name: evaluation_only_usage_is_not_an_exposure
  description: Test-eval, verify, Evaluation-only usage, Metric Events, and holdover paths that append no raw Exposure leave the Environment waiting.
  parameters: "app_id=app_status&environment_id=env_eval_only"
  expected_http_status: 200
  expected_result: ""
- name: delayed_convex_encounter_time_is_the_environment_first_exposure
  description: Environment status reports encounter order even when a trusted-adapter Exposure arrives after a later remote Exposure.
  parameters: "app_id=app_delayed&environment_id=env_prod"
  expected_http_status: 200
  expected_result: |
    {"app_id":"app_delayed","environment_id":"env_prod","first_exposure_at":"2026-07-05 06:00:00.000"}
- name: another_environment_is_isolated
  description: The App and Environment predicates are both required tenant boundaries.
  parameters: "app_id=app_status&environment_id=env_other"
  expected_http_status: 200
  expected_result: |
    {"app_id":"app_status","environment_id":"env_other","first_exposure_at":"2026-07-04 00:00:00.000"}
- name: deleted_environment_suppresses_late_exposure_state
  description: An Environment tombstone keeps an in-flight Exposure from rematerializing status after teardown.
  parameters: "app_id=app_status&environment_id=env_deleted"
  expected_http_status: 200
  expected_result: ""
- name: deleted_app_suppresses_every_environment
  description: An App tombstone suppresses late Exposure state for every Environment in the deleted App.
  parameters: "app_id=app_deleted&environment_id=env_late"
  expected_http_status: 200
  expected_result: ""
- name: missing_app_id_is_rejected
  description: A missing app_id fails loudly instead of widening to every App.
  parameters: "environment_id=env_prod"
  expected_http_status: 400
  expected_result: "app_id is required"
- name: missing_environment_id_is_rejected
  description: A missing environment_id fails loudly instead of widening to every Environment.
  parameters: "app_id=app_status"
  expected_http_status: 400
  expected_result: "environment_id is required"
