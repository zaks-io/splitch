# Negative fixture: a dynamic environment expression is unresolvable.
# Fail closed and treat the job as privileged.
name: dynamic-env-mutable-installer
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Unresolvable environment name
        type: string
        required: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Install
        run: curl -LsSf https://example.test/install.sh | sh
