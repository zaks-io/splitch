# Negative fixture: a multiline double-quoted `run` is valid GitHub Actions
# YAML. YAML folds the newline to a space, producing `curl … | sh`.
name: multiline-quoted-run-mutable-installer
on: push
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Install
        run: "curl -LsSf https://example.test/install.sh
          | sh"
