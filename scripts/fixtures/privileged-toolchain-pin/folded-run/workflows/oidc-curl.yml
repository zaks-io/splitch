# Negative fixture: a folded `run: >` scalar is valid GitHub Actions YAML.
# Folding joins the pipe onto the curl line; a `run: |` scanner would miss it.
name: folded-run-mutable-installer
on: push
jobs:
  publish:
    permissions:
      id-token: write
    steps:
      - name: Install
        run: >
          curl -LsSf https://example.test/install.sh
          | sh
