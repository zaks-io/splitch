# Negative fixture: corepack install and python interpreter options before -m.
name: installer-grammars
on: push
jobs:
  corepack-install:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: corepack install --global pnpm@latest
  python-isolated-pip:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: python -I -m pip install requests
  python-path-pip:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: /usr/bin/python3 -I -m pip install requests
