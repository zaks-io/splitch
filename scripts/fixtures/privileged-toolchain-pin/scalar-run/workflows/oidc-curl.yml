# Negative fixture: a same-line scalar `run:` is valid GitHub Actions YAML.
# A scanner that only reads `run: |` blocks would miss this curl-pipe.
name: scalar-run-mutable-installer
on: push
jobs:
  publish:
    permissions:
      id-token: write
    steps:
      - name: Install
        run: curl -LsSf https://example.test/install.sh | sh
