# Negative fixture: concatenated quotes and indirect shells hide argv.
name: indirect-quoting
on: push
jobs:
  concatenated-quotes:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: 'n"p"m install --global npm@11'
  sh-c:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: sh -c "npm install --global npm@11"
  eval-quoted:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: eval "npm install --global npm@11"
