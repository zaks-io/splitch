# Negative fixture: OIDC jobs may only install exact X.Y.Z versions.
# Shorthand, ranges, comparators, unpinned tools, and unresolved variables fail.
name: unpinned-installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Unresolvable installer version
        type: string
        required: true
jobs:
  npm-exact:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: npm install --global npm@11.15.0
  npm-shorthand:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: npm install --global npm@11
  npm-x-range:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: npm install --global npm@11.x
  npm-comparator:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: npm install --global npm@>=11.15.0
  pip-unpinned:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: pip install requests
  uv-unpinned:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: uv tool install tinybird
  cargo-unpinned:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: cargo install ripgrep
  npm-variable:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - run: npm install --global npm@${{ inputs.version }}
