# Negative fixture: a pinned composite default must not hide a caller override.
name: uses-override
on: push
jobs:
  override-latest:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: ./actions/pin-npm
        with:
          version: latest
  relay-latest:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: ./actions/relay
  default-pin:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: ./actions/pin-npm
