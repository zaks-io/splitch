# Negative fixture: a literal `run: |` with a shell backslash-newline is valid
# YAML and valid bash. The pipeline exists only after continuation removal.
name: literal-continuation-run-mutable-installer
on: push
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Install
        run: |
          curl -LsSf https://example.test/install.sh \
          | sh
