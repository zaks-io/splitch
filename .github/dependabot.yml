version: 2
updates:
  # pnpm workspace dependencies. Keep routine updates quiet and let releases
  # stabilize before Dependabot opens a PR. Security updates are not delayed by
  # cooldown and continue to be raised immediately.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    ignore:
      # TypeScript 7.0 ships no Compiler API at all; 7.1 will ship a new one.
      # tsup's bundled rollup-plugin-dts reads ts.sys and crashes every dts
      # build (egoist/tsup#1409 is unmerged), and Stryker 10 cannot start
      # (stryker-mutator/stryker-js#6110). Lift this when both ship: SPL-623.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      routine-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      routine-major:
        patterns:
          - "*"
        update-types:
          - major
    labels:
      - dependencies

  # GitHub Actions. Dependabot understands the `# vX.Y.Z` comment on a SHA pin
  # and bumps the SHA + comment together, so pinning to SHA does not cost us
  # update automation.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
