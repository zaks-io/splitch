version: 2
updates:
  # pnpm workspace dependencies. Keep routine updates quiet and let releases
  # stabilize before Dependabot opens a PR. Security updates are not delayed by
  # cooldown and continue to be raised immediately.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      routine-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      routine-major:
        patterns:
          - "*"
        update-types:
          - major
    labels:
      - dependencies

  # GitHub Actions. Dependabot understands the `# vX.Y.Z` comment on a SHA pin
  # and bumps the SHA + comment together, so pinning to SHA does not cost us
  # update automation.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
