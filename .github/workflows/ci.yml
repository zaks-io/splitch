name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      SPLITCH_PLATFORM_TARGET: pr-ci
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Install Tinybird CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify
        run: pnpm verify:ci

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/${checksums}"
          grep " ${asset}$" "${checksums}" > checksums.txt
          sha256sum -c checksums.txt
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        env:
          SECRETS_RANGE_BEFORE: ${{ github.event.before }}
          SECRETS_RANGE_AFTER: ${{ github.sha }}
        run: pnpm secrets:range

      - name: Require signed Turbo remote cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-turbo-remote-cache-env.mjs --required

      - name: Build production-target Vite Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SPLITCH_PLATFORM_TARGET: production
          CLOUDFLARE_ENV: production
          SPLITCH_GENERATED_WRANGLER_ENV: production
          SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm turbo run build --filter=@splitch/control-panel --filter=@splitch/marketing

  deploy-production:
    name: Deploy Production
    needs:
      - verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      actions: read
      contents: read
      deployments: read
    with:
      release_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      force_full_deploy: false
      allow_stale_release: false
    secrets: inherit
