name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      SPLITCH_PLATFORM_TARGET: pr-ci
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Install Tinybird CLI
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A change to how we cache is invisible to its own cache-first run: the
      # commit that broke wrangler-secrets.test.ts (SPL-258) landed alongside
      # SPL-252's cache-first CI change and shipped green because the old
      # result was replayed from cache instead of re-executed. The nightly
      # forced backstop catches this within 24h, but a caching-policy PR must
      # prove itself on the same run that changes the policy.
      - name: Force cache off for cache-policy changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Anything that governs which tasks are cached, how they're keyed,
          # or how the remote cache is validated. Deliberately narrow: other
          # workflow files don't touch caching and would just burn the cache
          # for no reason.
          CACHE_POLICY_PATTERN='(^|/)turbo\.json$|^\.github/workflows/ci\.yml$|^\.github/workflows/nightly-verify\.yml$|^scripts/check-turbo-remote-cache-env\.mjs$'

          force_cache_off() {
            local reason="$1"
            echo "TURBO_FORCE=true" >> "$GITHUB_ENV"
            echo "::notice title=Cache policy changed, forcing full re-execution::${reason}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "- **Cache forced off:** ${reason}" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
              force_cache_off "pull_request base/head SHA unavailable; cannot diff, so the cache is not trusted."
              exit 0
            fi
            if ! MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
              force_cache_off "could not compute a merge base between $BASE_SHA and $HEAD_SHA; cannot diff, so the cache is not trusted."
              exit 0
            fi
            CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              force_cache_off "no previous commit available for this push (new branch or force-push); cannot diff, so the cache is not trusted."
              exit 0
            fi
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          else
            force_cache_off "unrecognized trigger event ($EVENT_NAME); cannot diff, so the cache is not trusted."
            exit 0
          fi

          MATCHED=$(printf '%s\n' "$CHANGED" | grep -E "$CACHE_POLICY_PATTERN" || true)
          if [ -n "$MATCHED" ]; then
            force_cache_off "changed files touch the cache-policy surface: $(printf '%s' "$MATCHED" | tr '\n' ' ')"
          else
            echo "Cache-policy surface unchanged; Verify will use the remote cache normally."
          fi

      - name: Verify
        timeout-minutes: 15
        run: pnpm verify:ci

      - name: Install gitleaks
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSLO --max-time 120 "${base}/${asset}"
          curl -fsSLO --max-time 120 "${base}/${checksums}"
          grep " ${asset}$" "${checksums}" > checksums.txt
          sha256sum -c checksums.txt
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        env:
          SECRETS_RANGE_BEFORE: ${{ github.event.before }}
          SECRETS_RANGE_AFTER: ${{ github.sha }}
        run: pnpm secrets:range

      - name: Require signed Turbo remote cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-turbo-remote-cache-env.mjs --required

      - name: Build production-target Vite Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SPLITCH_PLATFORM_TARGET: production
          CLOUDFLARE_ENV: production
          SPLITCH_GENERATED_WRANGLER_ENV: production
          SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm turbo run build --filter=@splitch/control-panel --filter=@splitch/marketing

  deploy-production:
    name: Deploy Production
    needs:
      - verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      actions: read
      contents: read
      deployments: read
    with:
      release_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      force_full_deploy: false
      allow_stale_release: false
    secrets: inherit
