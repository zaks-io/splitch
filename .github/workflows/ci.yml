name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      SPLITCH_PLATFORM_TARGET: pr-ci
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      # A change to how we cache is invisible to its own cache-first run: the
      # commit that broke wrangler-secrets.test.ts (SPL-258) landed alongside
      # SPL-252's cache-first CI change and shipped green because the old
      # result was replayed from cache instead of re-executed. The nightly
      # forced backstop catches this within 24h, but a caching-policy PR must
      # prove itself on the same run that changes the policy.
      - name: Plan CI verification
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: node scripts/plan-ci-verification.mjs

      - name: Install Tinybird CLI
        if: steps.plan.outputs.tinybird == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Tinybird locally
        if: steps.plan.outputs.tinybird == 'true'
        run: pnpm tinybird:local

      - name: Validate D1 migrations locally
        if: steps.plan.outputs.d1 == 'true'
        run: pnpm d1:migrate:local && pnpm d1:migrate:populated

      - name: Verify
        timeout-minutes: 15
        env:
          USE_AFFECTED: ${{ steps.plan.outputs.use_affected }}
        run: |
          if [ "$USE_AFFECTED" = "true" ]; then
            pnpm verify:ci --affected --output-logs=new-only
          else
            pnpm verify:ci --output-logs=new-only
          fi

      - name: Install gitleaks
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSLO --max-time 120 "${base}/${asset}"
          curl -fsSLO --max-time 120 "${base}/${checksums}"
          grep " ${asset}$" "${checksums}" > checksums.txt
          sha256sum -c checksums.txt
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        env:
          SECRETS_RANGE_BEFORE: ${{ github.event.before }}
          SECRETS_RANGE_AFTER: ${{ github.sha }}
        run: pnpm secrets:range

      - name: Require signed Turbo remote cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-turbo-remote-cache-env.mjs --required

  deploy-production:
    name: Deploy Production
    needs:
      - verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      actions: read
      contents: read
      deployments: read
    with:
      release_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      force_full_deploy: false
      allow_stale_release: false
    secrets: inherit
