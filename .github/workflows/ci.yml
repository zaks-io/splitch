name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    # Forks cannot rely on the repository's private runner integration. Keep
    # their required check on GitHub-hosted compute; trusted branches retain
    # the measured Blacksmith runner and signed remote cache.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404' }}
    # The validators run serially inside this job, so the ceiling covers a
    # worst-case run that triggers both on top of a large affected graph.
    timeout-minutes: 25
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      SPLITCH_PLATFORM_TARGET: pr-ci
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      # Every run is cache-first, including cache-policy changes: the nightly
      # forced verify is the sole staleness backstop. The old SPL-258 guard
      # (force-uncached when ci.yml or the planner changed) re-billed the whole
      # suite on every push of such a PR plus its merge commit, so it was
      # dropped in favor of that 24h backstop.
      - name: Plan CI verification
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: node scripts/plan-ci-verification.mjs

      - name: Install gitleaks
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSLO --max-time 120 "${base}/${asset}"
          curl -fsSLO --max-time 120 "${base}/${checksums}"
          grep " ${asset}$" "${checksums}" > checksums.txt
          sha256sum -c checksums.txt
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        env:
          SECRETS_RANGE_BEFORE: ${{ github.event.before }}
          SECRETS_RANGE_AFTER: ${{ github.sha }}
        run: pnpm secrets:range

      - name: Verify
        timeout-minutes: 15
        env:
          USE_AFFECTED: ${{ steps.plan.outputs.use_affected }}
        run: |
          if [ "$USE_AFFECTED" = "true" ]; then
            pnpm verify:ci --affected --output-logs=new-only
          else
            pnpm verify:ci --output-logs=new-only
          fi

      # The validators live inside Verify rather than as sibling jobs: most
      # pushes skip both, and a skipped step costs nothing while a sibling job
      # bills its whole runner spin-up (checkout, pnpm, planner) just to skip.
      # They already share Verify's workspace install, and folding them keeps
      # "Verify" the sole required status check.
      - name: Validate D1 migrations locally
        if: steps.plan.outputs.d1 == 'true'
        timeout-minutes: 10
        run: pnpm d1:migrate:local && pnpm d1:migrate:populated

      - name: Install Tinybird CLI
        if: steps.plan.outputs.tinybird == 'true'
        timeout-minutes: 5
        uses: ./.github/actions/setup-tinybird-cli

      - name: Validate Tinybird locally
        if: steps.plan.outputs.tinybird == 'true'
        timeout-minutes: 10
        run: pnpm tinybird:local

      - name: Require signed Turbo remote cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-turbo-remote-cache-env.mjs --required

  deploy-production:
    name: Deploy Production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      actions: read
      contents: read
      deployments: read
    with:
      release_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      force_full_deploy: false
      allow_stale_release: false
    secrets: inherit
