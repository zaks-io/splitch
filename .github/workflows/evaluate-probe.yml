name: evaluate-probe

# Shared preview only. Production scheduling requires a separate approved change.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-probe-preview
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main' && vars.SPLITCH_EVALUATE_PROBE_ENABLED == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    environment: preview
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0

      - name: Measure shared-preview evaluation
        env:
          SPLITCH_SMOKE_CLIENT_KEY: ${{ secrets.SPLITCH_SMOKE_CLIENT_KEY }}
        run: node scripts/evaluate-probe.mjs
