name: security

# Runs daily and reports; it does not gate merges. Findings are uploaded as
# SARIF. The `alert` job turns an operational scan failure into one deduped
# GitHub issue, which the GitHub<->Linear sync mirrors into the Splitch team.
#
# The pull_request + push triggers stay off deliberately. Every job here already
# branches on the event, so adding them arms the `pnpm audit` merge gate. A
# transitive dev-dependency advisory unrelated to the branch would then block
# that PR. Semgrep findings remain non-gating; only scanner execution failures
# fail its job. Turn the triggers on in the dependency lockdown pass, once the
# tree is settled enough that a finding is signal about the change in flight.
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Dependency vulnerabilities (OSV.dev, pnpm-lock-aware) + native pnpm audit.
  # On PR/push: fails the job so branch protection blocks the merge.
  # On schedule: uploads SARIF; an operational job failure opens an issue.
  # ---------------------------------------------------------------------------
  deps:
    name: Dependency scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OSV scan (SARIF)
        id: osv
        run: |
          set +e
          docker run --rm \
            --entrypoint osv-scanner \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src \
            ghcr.io/google/osv-scanner-action@sha256:48406c58197201fe55e56615ad9d414f85063da320e204d0b0ed460fb3908dba \
            --output-file=/src/osv.sarif \
            --format=sarif \
            --recursive \
            ./
          scan_status=$?
          set -e
          echo "status=${scan_status}" >> "$GITHUB_OUTPUT"

      - name: Upload OSV SARIF
        if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      # Exit 0 and 1 are normal scan results. Every other status is an execution
      # failure, which must reach the scheduled alert job.
      - name: Fail on OSV operational error
        if: always()
        env:
          OSV_STATUS: ${{ steps.osv.outputs.status }}
        run: |
          case "$OSV_STATUS" in
            ""|*[!0-9]*)
              echo "OSV-Scanner did not report a valid exit status."
              exit 1
              ;;
          esac
          if [ "$OSV_STATUS" -ne 0 ] && [ "$OSV_STATUS" -ne 1 ]; then
            echo "OSV-Scanner failed to execute (exit ${OSV_STATUS})."
            exit 1
          fi

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gate merges: on PR/push a high/critical advisory fails the job. On the
      # scheduled run we don't gate (nothing to merge); SARIF carries findings
      # and the alert job carries operational failures.
      - name: pnpm audit (gate on PR/push)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # SAST: Semgrep with OSS rulesets + repo-local rules under .semgrep/.
  # ---------------------------------------------------------------------------
  sast:
    name: Semgrep SAST
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:c180f0c93a17b420c0af5006214a29d3c747c5459c732b740191adf657dd0068 # latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep scan (SARIF)
        id: semgrep
        run: |
          set +e
          semgrep scan \
            --config p/default \
            --config .semgrep/ \
            --sarif --output semgrep.sarif \
            --error
          scan_status=$?
          set -e
          echo "status=${scan_status}" >> "$GITHUB_OUTPUT"

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on Semgrep operational error
        if: always() && steps.semgrep.outputs.status != '0' && steps.semgrep.outputs.status != '1'
        env:
          SEMGREP_STATUS: ${{ steps.semgrep.outputs.status }}
        run: |
          echo "Semgrep failed to execute (exit ${SEMGREP_STATUS:-unknown})."
          exit 1

  # ---------------------------------------------------------------------------
  # Filesystem CVE scan. trivy-action pinned to the pre-compromise safe SHA
  # (advisory GHSA-69fq-xp46-6x23; tags 0.36.x were force-pushed to malware).
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy filesystem
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy fs scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # OpenSSF Scorecard: supply-chain posture. Scheduled + push to main only.
  # ---------------------------------------------------------------------------
  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # ---------------------------------------------------------------------------
  # Scheduled-only: if any scan job failed to execute, open or update a single
  # deduped GitHub issue. The GitHub<->Linear sync mirrors it into the Splitch
  # team automatically. Body comes from a repo-controlled file, never from
  # untrusted github.event.* input -> no workflow-injection surface.
  # ---------------------------------------------------------------------------
  alert:
    name: Open security alert issue
    if: always() && github.event_name == 'schedule'
    needs: [deps, sast, trivy, scorecard]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build issue body
        if: needs.deps.result == 'failure' || needs.sast.result == 'failure' || needs.trivy.result == 'failure' || needs.scorecard.result == 'failure'
        env:
          DEPS_RESULT: ${{ needs.deps.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SCORECARD_RESULT: ${{ needs.scorecard.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "One or more daily security scan jobs failed to execute."
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Dependency scan | ${DEPS_RESULT} |"
            echo "| Semgrep SAST | ${SAST_RESULT} |"
            echo "| Trivy filesystem | ${TRIVY_RESULT} |"
            echo "| OpenSSF Scorecard | ${SCORECARD_RESULT} |"
            echo ""
            echo "Review details in the [Security tab](../../security/code-scanning) and the [workflow run](${RUN_URL})."
          } > security-alert.md

      - name: Open or update issue
        if: needs.deps.result == 'failure' || needs.sast.result == 'failure' || needs.trivy.result == 'failure' || needs.scorecard.result == 'failure'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Daily security scan: operational failure"
          content-filepath: security-alert.md
          labels: security, automated
