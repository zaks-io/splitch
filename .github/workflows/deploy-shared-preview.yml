name: deploy-shared-preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy to shared preview"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: shared-preview-deploy
  cancel-in-progress: false

env:
  CI: "true"
  SPLITCH_REQUIRE_WORKER_SECRET_ENV: "1"
  SPLITCH_REQUIRE_SENTRY_SOURCE_MAP_ENV: "1"
  SPLITCH_PLATFORM_TARGET: shared-preview

jobs:
  deploy:
    name: Deploy Shared Preview
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: preview
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TB_TOKEN: ${{ secrets.TB_TOKEN || secrets.TINYBIRD_DEPLOY_TOKEN }}
      TB_HOST: ${{ vars.TB_HOST || 'https://api.us-west-2.aws.tinybird.co' }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      ASSERTION_SIGNING_SECRET: ${{ secrets.ASSERTION_SIGNING_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
      EVALUATION_PRIVACY_SALT: ${{ secrets.EVALUATION_PRIVACY_SALT }}
      SPLITCH_EVENT_INGEST_TOKEN: ${{ secrets.SPLITCH_EVENT_INGEST_TOKEN }}
      TINYBIRD_INGEST_TOKEN: ${{ secrets.TINYBIRD_INGEST_TOKEN }}
      TINYBIRD_READ_TOKEN: ${{ secrets.TINYBIRD_READ_TOKEN }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      SPLITCH_SMOKE_CLIENT_SECRET: ${{ secrets.SPLITCH_SMOKE_CLIENT_SECRET }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check deploy credentials
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TB_TOKEN TB_HOST ACCESS_TOKEN_SECRET ASSERTION_SIGNING_SECRET SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT EVALUATION_PRIVACY_SALT SPLITCH_EVENT_INGEST_TOKEN TINYBIRD_INGEST_TOKEN TINYBIRD_READ_TOKEN TURNSTILE_SECRET WORKOS_CLIENT_ID WORKOS_API_KEY SPLITCH_SMOKE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for shared-preview deploys"
              exit 1
            fi
          done

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Install Tinybird CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure Tinybird shared_preview branch
        shell: bash
        run: |
          set -euo pipefail
          if ! tb --no-version-warning branch ls | grep -Eq '(^|[[:space:]])shared_preview([[:space:]]|$)'; then
            tb --no-version-warning branch create shared_preview --last-partition --wait
          fi

      - name: Deploy shared preview
        run: pnpm deploy:shared-preview

      - name: Seed shared preview smoke data
        run: pnpm shared-preview:seed-smoke

      - name: Smoke shared preview
        env:
          SPLITCH_SMOKE_CLIENT_SECRET: ${{ secrets.SPLITCH_SMOKE_CLIENT_SECRET }}
        run: |
          SPLITCH_SMOKE_COMMIT_SHA="$(git rev-parse HEAD)" pnpm shared-preview:smoke

      - name: Clean up shared preview smoke data
        if: always()
        run: pnpm shared-preview:cleanup-smoke

      - name: Upload Playwright smoke report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shared-preview-playwright-report
          path: |
            playwright-report/shared-preview
            test-results/shared-preview
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## Shared preview deploy"
            echo
            echo "- Ref: \`$(git rev-parse HEAD)\`"
            echo "- Tinybird Branch: \`shared_preview\`"
            echo "- Marketing: https://preview.splitch.dev/"
            echo "- Control Panel: https://app.preview.splitch.dev/"
            echo "- Control Plane API: https://api.preview.splitch.dev/"
            echo "- Auth API: https://auth.preview.splitch.dev/"
            echo "- Evaluation API: https://edge.preview.splitch.dev/"
            echo "- Event Ingest API: https://ingest.preview.splitch.dev/"
            echo "- MCP: https://mcp.preview.splitch.dev/"
            echo "- Smoke: Playwright API tests (\`pnpm shared-preview:smoke\`)"
          } >> "$GITHUB_STEP_SUMMARY"
