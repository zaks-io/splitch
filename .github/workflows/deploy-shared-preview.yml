name: deploy-shared-preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy to shared preview"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: shared-preview-deploy
  cancel-in-progress: false

env:
  CI: "true"
  SPLITCH_REQUIRE_WORKER_SECRET_ENV: "1"
  SPLITCH_REQUIRE_SENTRY_SOURCE_MAP_ENV: "1"
  SPLITCH_PLATFORM_TARGET: shared-preview

jobs:
  deploy:
    name: Deploy Shared Preview
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: preview
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TB_TOKEN: ${{ secrets.TB_TOKEN || secrets.TINYBIRD_DEPLOY_TOKEN }}
      TB_HOST: ${{ vars.TB_HOST || 'https://api.us-west-2.aws.tinybird.co' }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      ASSERTION_SIGNING_SECRET: ${{ secrets.ASSERTION_SIGNING_SECRET }}
      CONTROL_PANEL_DELEGATION_SECRET: ${{ secrets.CONTROL_PANEL_DELEGATION_SECRET }}
      CONVEX_WEBHOOK_KEK: ${{ secrets.CONVEX_WEBHOOK_KEK }}
      INTEGRATION_SECRET_KEK: ${{ secrets.INTEGRATION_SECRET_KEK }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
      EVALUATION_PRIVACY_SALT: ${{ secrets.EVALUATION_PRIVACY_SALT }}
      EXPOSURE_TICKET_KEY: ${{ secrets.EXPOSURE_TICKET_KEY }}
      MCP_CONTROL_PLANE_DELEGATION_SECRET: ${{ secrets.MCP_CONTROL_PLANE_DELEGATION_SECRET }}
      SPLITCH_EVENT_INGEST_TOKEN: ${{ secrets.SPLITCH_EVENT_INGEST_TOKEN }}
      SPLITCH_DEPLOY_GATE_TOKEN: ${{ secrets.SPLITCH_DEPLOY_GATE_TOKEN }}
      TINYBIRD_INGEST_TOKEN: ${{ secrets.TINYBIRD_INGEST_TOKEN }}
      TINYBIRD_RUN_SNAPSHOT_TOKEN: ${{ secrets.TINYBIRD_RUN_SNAPSHOT_TOKEN }}
      TINYBIRD_APPROVAL_ARCHIVE_WRITE_TOKEN: ${{ secrets.TINYBIRD_APPROVAL_ARCHIVE_WRITE_TOKEN }}
      TINYBIRD_APPROVAL_ARCHIVE_READ_TOKEN: ${{ secrets.TINYBIRD_APPROVAL_ARCHIVE_READ_TOKEN }}
      TINYBIRD_READ_TOKEN: ${{ secrets.TINYBIRD_READ_TOKEN }}
      TINYBIRD_DELETE_TOKEN: ${{ secrets.TINYBIRD_DELETE_TOKEN }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      WORKOS_ISSUER: ${{ vars.WORKOS_ISSUER }}
      WORKOS_JWKS_URI: ${{ vars.WORKOS_JWKS_URI }}
      SPLITCH_SMOKE_CLIENT_SECRET: ${{ secrets.SPLITCH_SMOKE_CLIENT_SECRET }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve immutable deploy revision
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(git rev-parse HEAD)"
          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::checked-out deploy revision is not a full commit SHA"
            exit 1
          fi
          echo "SPLITCH_DEPLOYED_COMMIT_SHA=$deployed_sha" >> "$GITHUB_ENV"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check deploy credentials
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TB_TOKEN TB_HOST ACCESS_TOKEN_SECRET ASSERTION_SIGNING_SECRET CONTROL_PANEL_DELEGATION_SECRET SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT EVALUATION_PRIVACY_SALT EXPOSURE_TICKET_KEY SPLITCH_EVENT_INGEST_TOKEN SPLITCH_DEPLOY_GATE_TOKEN TINYBIRD_DELETE_TOKEN TINYBIRD_INGEST_TOKEN TINYBIRD_RUN_SNAPSHOT_TOKEN TINYBIRD_APPROVAL_ARCHIVE_WRITE_TOKEN TINYBIRD_APPROVAL_ARCHIVE_READ_TOKEN TINYBIRD_READ_TOKEN TURNSTILE_SECRET WORKOS_CLIENT_ID WORKOS_API_KEY WORKOS_ISSUER WORKOS_JWKS_URI SPLITCH_SMOKE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for shared-preview deploys"
              exit 1
            fi
          done

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Install Tinybird CLI
        timeout-minutes: 5
        uses: ./.github/actions/setup-tinybird-cli

      - name: Ensure Tinybird shared_preview branch
        shell: bash
        run: |
          set -euo pipefail
          if ! tb --no-version-warning branch ls | grep -Eq '(^|[[:space:]])shared_preview([[:space:]]|$)'; then
            tb --no-version-warning branch create shared_preview --last-partition --wait
          fi

      - name: Deploy shared preview
        id: deploy
        run: pnpm deploy:shared-preview

      - name: Seed shared preview smoke data
        id: seed
        continue-on-error: true
        run: pnpm shared-preview:seed-smoke

      - name: Smoke shared preview
        id: smoke
        if: steps.seed.outcome == 'success'
        continue-on-error: true
        env:
          SPLITCH_SMOKE_CLIENT_SECRET: ${{ secrets.SPLITCH_SMOKE_CLIENT_SECRET }}
        run: SPLITCH_SMOKE_COMMIT_SHA="$SPLITCH_DEPLOYED_COMMIT_SHA" pnpm shared-preview:smoke

      - name: Dark-launch shared preview
        id: dark_launch
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          SPLITCH_SMOKE_CLIENT_SECRET: ${{ secrets.SPLITCH_SMOKE_CLIENT_SECRET }}
          SPLITCH_SMOKE_COMMIT_SHA: ${{ env.SPLITCH_DEPLOYED_COMMIT_SHA }}
          SPLITCH_SMOKE_RUNS: "2"
        run: pnpm smoke:dark-launch:shared-preview

      - name: Safe-delivery tracer shared preview
        id: safe_delivery
        if: steps.dark_launch.outcome == 'success'
        continue-on-error: true
        env:
          SPLITCH_SMOKE_CLIENT_SECRET: ${{ secrets.SPLITCH_SMOKE_CLIENT_SECRET }}
          SPLITCH_SMOKE_COMMIT_SHA: ${{ env.SPLITCH_DEPLOYED_COMMIT_SHA }}
          SPLITCH_SMOKE_RUNS: "2"
        run: pnpm smoke:safe-delivery:shared-preview

      - name: Install Playwright Chromium
        id: browser
        if: steps.safe_delivery.outcome == 'success'
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed shared preview panel login
        id: panel_seed
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        run: pnpm shared-preview:seed-panel-user

      - name: Panel golden path shared preview
        id: panel_smoke
        if: steps.panel_seed.outcome == 'success'
        continue-on-error: true
        env:
          SPLITCH_SMOKE_COMMIT_SHA: ${{ env.SPLITCH_DEPLOYED_COMMIT_SHA }}
        run: pnpm shared-preview:smoke:panel

      - name: Clean up shared preview smoke data
        id: cleanup
        if: always()
        continue-on-error: true
        run: pnpm shared-preview:cleanup-smoke

      - name: Upload Playwright smoke report
        id: artifact
        if: >-
          always() &&
          (steps.seed.outcome == 'failure' ||
          steps.smoke.outcome == 'failure' ||
          steps.dark_launch.outcome == 'failure' ||
          steps.safe_delivery.outcome == 'failure' ||
          steps.panel_seed.outcome == 'failure' ||
          steps.panel_smoke.outcome == 'failure')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-preview-playwright-report
          path: |
            playwright-report/shared-preview
            test-results/shared-preview
          if-no-files-found: ignore

      - name: Summary
        if: always()
        continue-on-error: true
        env:
          SPLITCH_SEED_OUTCOME: ${{ steps.seed.outcome }}
          SPLITCH_SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SPLITCH_DARK_LAUNCH_OUTCOME: ${{ steps.dark_launch.outcome }}
          SPLITCH_SAFE_DELIVERY_OUTCOME: ${{ steps.safe_delivery.outcome }}
          SPLITCH_PANEL_BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SPLITCH_PANEL_SEED_OUTCOME: ${{ steps.panel_seed.outcome }}
          SPLITCH_PANEL_SMOKE_OUTCOME: ${{ steps.panel_smoke.outcome }}
          SPLITCH_CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          SPLITCH_ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: node scripts/render-shared-preview-summary.mjs smoke >> "$GITHUB_STEP_SUMMARY"
