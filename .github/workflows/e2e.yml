name: e2e

# The Control Panel Playwright harness is too slow and too flaky for the
# per-push hot path, so it runs nightly as a signal-only check. A red run
# never blocks deploys; triage it from the Actions UI.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-main
  cancel-in-progress: false

jobs:
  control-panel-e2e:
    name: Control Panel E2E
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      SPLITCH_PLATFORM_TARGET: pr-ci
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Control Panel E2E
        run: pnpm turbo run test:e2e --filter=@splitch/control-panel

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: control-panel-e2e-artifacts
          path: |
            test-results/control-panel-e2e
            playwright-report
          if-no-files-found: error
          retention-days: 14
