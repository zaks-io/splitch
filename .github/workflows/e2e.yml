name: e2e

# The Control Panel Playwright harness is too slow and too flaky for the
# per-push hot path. While SPL-181 keeps the local D1 harness from producing a
# trustworthy signal, it runs weekly and remains manually dispatchable.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-main
  cancel-in-progress: false

jobs:
  control-panel-e2e:
    name: Control Panel E2E
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      SPLITCH_PLATFORM_TARGET: pr-ci
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Control Panel E2E
        run: pnpm turbo run test:e2e --filter=@splitch/control-panel

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-panel-e2e-artifacts
          path: |
            test-results/control-panel-e2e
            playwright-report
          if-no-files-found: error
          retention-days: 14
