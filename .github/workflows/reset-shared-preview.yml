name: reset-shared-preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-preview-deploy
  cancel-in-progress: false

env:
  CI: "true"
  SPLITCH_PLATFORM_TARGET: shared-preview

jobs:
  reset:
    name: Reset Shared Preview
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TB_TOKEN: ${{ secrets.TB_TOKEN || secrets.TINYBIRD_DEPLOY_TOKEN }}
      TB_HOST: ${{ vars.TB_HOST || 'https://api.us-west-2.aws.tinybird.co' }}
      SPLITCH_SMOKE_CLIENT_SECRET: ${{ secrets.SPLITCH_SMOKE_CLIENT_SECRET }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve currently deployed preview revision
        shell: bash
        run: |
          set -euo pipefail
          workflow_ref="$(git rev-parse HEAD)"
          echo "SPLITCH_WORKFLOW_REF=$workflow_ref" >> "$GITHUB_ENV"
          deployed_sha="$(node scripts/resolve-shared-preview-deployed-sha.mjs)"
          echo "SPLITCH_DEPLOYED_COMMIT_SHA=$deployed_sha" >> "$GITHUB_ENV"

      - name: Check reset credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TB_TOKEN TB_HOST SPLITCH_SMOKE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for shared-preview reset"
              exit 1
            fi
          done

      - name: Install Tinybird CLI
        timeout-minutes: 5
        uses: ./.github/actions/setup-tinybird-cli

      - name: Reset preview-only state
        id: reset
        run: pnpm shared-preview:reset

      - name: Verify clean shared preview
        id: smoke
        run: SPLITCH_SMOKE_COMMIT_SHA="$SPLITCH_DEPLOYED_COMMIT_SHA" pnpm shared-preview:smoke

      - name: Clean up transient shared-preview smoke data
        id: cleanup
        if: ${{ always() && steps.reset.outcome == 'success' }}
        run: pnpm shared-preview:cleanup-smoke

      - name: Upload Playwright smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-preview-reset-playwright-report
          path: |
            playwright-report/shared-preview
            test-results/shared-preview
          if-no-files-found: ignore

      - name: Summary
        if: always()
        env:
          SPLITCH_RESET_OUTCOME: ${{ steps.reset.outcome }}
          SPLITCH_SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SPLITCH_CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: node scripts/render-shared-preview-summary.mjs reset >> "$GITHUB_STEP_SUMMARY"
