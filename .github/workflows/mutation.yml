name: mutation

# Advisory mutation testing per ADR-0031. Not part of the per-PR `ci` gate.
# Runs on demand and on a weekly schedule to establish per-package baselines.
# Reports are uploaded as artifacts; thresholds stay advisory (break: null)
# until a package has a documented stable baseline.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Package scope to mutate
        required: true
        default: all
        type: choice
        options:
          - all
          - sdk
          - contracts
          - stats
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan Mutation Scope
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Select package scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          sdk='{"name":"sdk","workspace":"@splitch/sdk","report_dir":"packages/sdk/reports/mutation"}'
          contracts='{"name":"contracts","workspace":"@splitch/contracts","report_dir":"packages/contracts/reports/mutation"}'
          stats='{"name":"stats","workspace":"@splitch/stats","report_dir":"packages/stats/reports/mutation"}'

          if [ "$EVENT_NAME" = "schedule" ]; then
            epoch_week="$(( $(date -u +%s) / 604800 ))"
            case "$((epoch_week % 3))" in
              0) matrix="{\"include\":[$sdk]}" ;;
              1) matrix="{\"include\":[$contracts]}" ;;
              *) matrix="{\"include\":[$stats]}" ;;
            esac
          else
            case "$REQUESTED_SCOPE" in
              sdk) matrix="{\"include\":[$sdk]}" ;;
              contracts) matrix="{\"include\":[$contracts]}" ;;
              stats) matrix="{\"include\":[$stats]}" ;;
              all) matrix="{\"include\":[$sdk,$contracts,$stats]}" ;;
              *) echo "::error::Unknown mutation scope: $REQUESTED_SCOPE"; exit 1 ;;
            esac
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutation:
    name: Mutation (${{ matrix.name }})
    needs: plan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      # Matches the ci Verify job so env-hashed builds replay from the remote cache.
      SPLITCH_PLATFORM_TARGET: pr-ci
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore mutation baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.report_dir }}/stryker-incremental.json
          key: mutation-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            mutation-${{ runner.os }}-${{ matrix.name }}-

      - name: Build
        run: pnpm turbo run build --filter="${{ matrix.workspace }}"

      - name: Mutation test
        timeout-minutes: 18
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${{ matrix.report_dir }}"
          pnpm --filter "${{ matrix.workspace }}" test:mutation 2>&1 | tee "${{ matrix.report_dir }}/mutation.log"

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.name }}-reports
          path: |
            ${{ matrix.report_dir }}/mutation.html
            ${{ matrix.report_dir }}/stryker-incremental.json
            ${{ matrix.report_dir }}/mutation.log
          if-no-files-found: error
          retention-days: 14
