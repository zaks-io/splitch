name: cli-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  authorize:
    name: Authorize CLI Release Ref
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$RELEASE_REF" != "$expected_ref" ] || [ "$RELEASE_REF_PROTECTED" != "true" ]; then
            echo "::error::CLI releases must run from protected ref $expected_ref; received $RELEASE_REF (protected=$RELEASE_REF_PROTECTED)"
            exit 1
          fi

  validate:
    name: Validate CLI Candidate
    needs: authorize
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      cli_version: ${{ steps.resolve.outputs.cli_version }}
      cli_tag: ${{ steps.resolve.outputs.cli_tag }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      already_released: ${{ steps.release-state.outputs.already_released }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      # Matches the ci Verify job so env-hashed tasks (control-panel#build and
      # its dependents) replay from the remote cache instead of rebuilding.
      SPLITCH_PLATFORM_TARGET: pr-ci
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Install Tinybird CLI
        timeout-minutes: 5
        uses: ./.github/actions/setup-tinybird-cli

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/${checksums}"
          grep " ${asset}$" "${checksums}" > checksums.txt
          sha256sum -c checksums.txt
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Resolve CLI release target
        id: resolve
        run: |
          set -euo pipefail
          target="$(node scripts/release/resolve-version.mjs cli "$GITHUB_WORKSPACE")"
          cli_version="$(printf '%s' "$target" | jq -r '.version')"
          cli_tag="$(printf '%s' "$target" | jq -r '.tag')"
          {
            echo "cli_version=$cli_version"
            echo "cli_tag=$cli_tag"
            echo "commit_sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## CLI release target"
            echo
            echo "- Package: \`@splitch/cli\`"
            echo "- Version: \`$cli_version\`"
            echo "- Tag: \`$cli_tag\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A version whose tag already has a published (non-draft) release is a
      # deliberate no-op, not a failure: bump the manifest to cut a release.
      - name: Check whether this version is already released
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ steps.resolve.outputs.cli_tag }}
        run: |
          set -euo pipefail
          already_released="$(node scripts/release/check-release-published.mjs cli "$GITHUB_WORKSPACE")"
          echo "already_released=$already_released" >> "$GITHUB_OUTPUT"
          if [ "$already_released" = "true" ]; then
            echo "::notice::$CLI_TAG already has a published release; bump apps/cli/package.json to cut a new release. Nothing was validated or drafted."
            {
              echo "## CLI release skipped"
              echo
              echo "\`$CLI_TAG\` already has a published release. Bump the version in"
              echo "\`apps/cli/package.json\` to cut a new release. Nothing was validated or drafted."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate CLI candidate
        if: steps.release-state.outputs.already_released != 'true'
        run: node scripts/release/validate-candidate.mjs cli "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cli-release-artifacts"

      - name: Upload validation artifacts
        if: steps.release-state.outputs.already_released != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release-validation-${{ steps.resolve.outputs.cli_tag }}
          path: ${{ runner.temp }}/cli-release-artifacts/
          retention-days: 30

  prepare:
    name: Prepare CLI Release Artifacts
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: validate
    if: needs.validate.outputs.already_released != 'true'
    outputs:
      cli_tag: ${{ needs.validate.outputs.cli_tag }}
      commit_sha: ${{ needs.validate.outputs.commit_sha }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Download validation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release-validation-${{ needs.validate.outputs.cli_tag }}
          path: ${{ runner.temp }}/cli-release-artifacts

      # Turbo builds the SDK dependency first so CLI declarations resolve the
      # exact public artifact consumers install.
      - name: Build @splitch/cli for release packaging
        run: pnpm exec turbo run build --filter=@splitch/cli

      - name: Prepare release artifacts
        id: prepare
        env:
          CLI_TAG: ${{ needs.validate.outputs.cli_tag }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          manifest="$(node scripts/release/prepare-artifacts.mjs cli "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cli-release-artifacts" "$COMMIT_SHA")"
          echo "$manifest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release-package-${{ needs.validate.outputs.cli_tag }}
          path: ${{ runner.temp }}/cli-release-artifacts/
          retention-days: 90

  draft-release:
    name: Create Or Update Draft Release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [validate, prepare]
    if: needs.validate.outputs.already_released != 'true'
    env:
      CLI_TAG: ${{ needs.validate.outputs.cli_tag }}
      CLI_VERSION: ${{ needs.validate.outputs.cli_version }}
      COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The cli-v* tag ruleset restricts creation/update/deletion, and the
      # standard Actions token cannot be a ruleset bypass actor. This dedicated
      # App (contents:write only, installed on this repo) is the sole bypass
      # actor; the step fails loudly if its credentials are absent.
      - name: Mint CLI release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SDK_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release-package-${{ needs.validate.outputs.cli_tag }}
          path: ${{ runner.temp }}/cli-release-artifacts

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          result="$(node scripts/release/publish-draft-release.mjs cli "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cli-release-artifacts" "$COMMIT_SHA")"
          release_url="$(printf '%s' "$result" | jq -r '.url')"
          {
            echo "## Draft CLI release"
            echo
            echo "- Tag: \`$CLI_TAG\`"
            echo "- Version: \`$CLI_VERSION\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Release: $release_url"
            echo
            echo "This workflow does not publish to npm."
          } >> "$GITHUB_STEP_SUMMARY"
