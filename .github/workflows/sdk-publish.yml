name: sdk-publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdk-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  publish:
    name: Publish @splitch/sdk
    if: startsWith(github.event.release.tag_name, 'sdk-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sdk_version: ${{ steps.target.outputs.sdk_version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve SDK release target
        id: target
        run: |
          set -euo pipefail
          target="$(node scripts/release/resolve-version.mjs sdk "$GITHUB_WORKSPACE")"
          {
            echo "sdk_version=$(printf '%s' "$target" | jq -r '.version')"
            echo "sdk_tag=$(printf '%s' "$target" | jq -r '.tag')"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release source and commit
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/release/validate-publish-context.mjs sdk "$GITHUB_WORKSPACE"

      - name: Refresh live release state before npm version check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/validate-live-publish-state.mjs sdk "$GITHUB_WORKSPACE"

      - name: Check whether SDK version is already published
        id: npm-version
        env:
          SDK_VERSION: ${{ steps.target.outputs.sdk_version }}
        working-directory: packages/sdk
        run: |
          set -euo pipefail
          already_published="$(node "$GITHUB_WORKSPACE/scripts/release/check-published-version.mjs" sdk "$SDK_VERSION")"
          echo "already_published=$already_published" >> "$GITHUB_OUTPUT"
          if [ "$already_published" = "true" ]; then
            echo "Skipping immutable npm version @splitch/sdk@$SDK_VERSION: it already exists"
          else
            echo "@splitch/sdk@$SDK_VERSION is not published; publish may proceed"
          fi

      - name: Install release dependencies
        if: steps.npm-version.outputs.already_published != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build @splitch/sdk
        if: steps.npm-version.outputs.already_published != 'true'
        run: pnpm --filter @splitch/sdk build

      - name: Check release package contents
        if: steps.npm-version.outputs.already_published != 'true'
        run: |
          pnpm --filter @splitch/sdk run pack:dry-run
          pnpm --filter @splitch/sdk run pack:check

      # Publish the staged tarball: the same bytes pack:check validated and
      # the draft release attached. The live tree is never packed in place.
      - name: Pack release tarball
        if: steps.npm-version.outputs.already_published != 'true'
        id: pack
        working-directory: packages/sdk
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-publish"
          tarball="$(node scripts/pack-release.mjs "$RUNNER_TEMP/npm-publish" | tail -n 1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish @splitch/sdk with provenance
        if: steps.npm-version.outputs.already_published != 'true'
        working-directory: packages/sdk
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$RUNNER_TEMP/npm-publish/$RELEASE_TARBALL" --provenance --access public --tag latest

      - name: Publish summary
        if: always()
        env:
          ALREADY_PUBLISHED: ${{ steps.npm-version.outputs.already_published }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
          SDK_VERSION: ${{ steps.target.outputs.sdk_version }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$ALREADY_PUBLISHED" in
            true) decision="skip-already-published" ;;
            false) decision="publish" ;;
            *) decision="not-evaluated" ;;
          esac
          {
            echo '## SDK publish'
            echo
            echo '- Package: @splitch/sdk'
            echo "- Version: $SDK_VERSION"
            echo "- Release tag: $RELEASE_TAG"
            echo "- Release target commit: $RELEASE_TARGET_COMMITISH"
            echo "- Commit: $GITHUB_SHA"
            echo '- Runner: ubuntu-24.04 (GitHub-hosted)'
            echo '- Provenance: npm trusted publishing/OIDC with npm publish --provenance'
            echo '- npm dist-tag: latest'
            echo "- Decision: $decision"
          } >> "$GITHUB_STEP_SUMMARY"

  linear-release:
    name: Track @splitch/sdk Linear Release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: publish
    environment: production
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check Linear release credential
        env:
          SDK_LINEAR_ACCESS_KEY: ${{ secrets.SDK_LINEAR_ACCESS_KEY }}
        run: |
          if [ -z "$SDK_LINEAR_ACCESS_KEY" ]; then
            echo "::error::SDK_LINEAR_ACCESS_KEY is required to track @splitch/sdk releases"
            exit 1
          fi

      - name: Sync Linear release
        id: linear-release
        uses: linear/linear-release-action@3858a5d7892435dc63302ac76b0cdb587435caa9 # v0.14.6
        with:
          access_key: ${{ secrets.SDK_LINEAR_ACCESS_KEY }}
          name: "@splitch/sdk ${{ needs.publish.outputs.sdk_version }}"
          version: ${{ needs.publish.outputs.sdk_version }}
          include_paths: packages/sdk/**,packages/contracts/**,packages/control-plane-sdk/**,packages/evaluation-core/**
          links: |
            GitHub Release=${{ github.event.release.html_url }}
            npm=https://www.npmjs.com/package/@splitch/sdk/v/${{ needs.publish.outputs.sdk_version }}
            GitHub Actions=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Summary
        env:
          LINEAR_RELEASE_URL: ${{ steps.linear-release.outputs.release-url }}
          SDK_VERSION: ${{ needs.publish.outputs.sdk_version }}
        run: |
          if [ -z "$LINEAR_RELEASE_URL" ]; then
            echo "::error::Linear did not return an @splitch/sdk release URL"
            exit 1
          fi
          {
            echo "## @splitch/sdk Linear release"
            echo
            echo "- Version: \`$SDK_VERSION\`"
            echo "- Linear: $LINEAR_RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
