name: nightly-verify

# Per-PR and per-push CI leans fully on the Turbo remote cache. This nightly
# run is the staleness backstop: TURBO_FORCE re-executes every task from
# source and rewrites fresh signed cache entries, so a stale or wrong cache
# entry can survive at most one day. Signal-only; it gates nothing.
on:
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-verify
  cancel-in-progress: false

jobs:
  verify-forced:
    name: Verify Forced
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_FORCE: "true"
      SPLITCH_PLATFORM_TARGET: pr-ci
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Full history brings the cli-v* tags check:request-contract-compat anchors on.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile

      - name: Require signed Turbo remote cache
        run: node scripts/check-turbo-remote-cache-env.mjs --required

      # The SDK consumer smoke packs and installs the real tarball, so it is
      # cache:false by design. Running it per-PR re-billed every push; it rides
      # the nightly forced run instead.
      - name: Verify (forced, no cache reads)
        timeout-minutes: 20
        env:
          # Read-only workflow token: check:request-contract-compat asks the
          # Releases API which cli-v* tag is published, not merely drafted.
          GH_TOKEN: ${{ github.token }}
        run: pnpm verify:ci "@splitch/sdk#test:consumer-smoke"
