name: deploy-production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Production Deploy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      SPLITCH_PLATFORM_TARGET: production
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys must run from main. Current ref: $GITHUB_REF"
          exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Install Tinybird CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify
        run: pnpm verify:ci

  deploy:
    name: Deploy Production
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: validate
    environment: production
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      SPLITCH_PLATFORM_TARGET: production
      TB_TOKEN: ${{ secrets.TB_TOKEN }}
      TB_HOST: ${{ vars.TB_HOST }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys must run from main. Current ref: $GITHUB_REF"
          exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Build production deploy graph
        run: >
          pnpm exec turbo run build
          --filter=@splitch/analysis-api...
          --filter=@splitch/auth-api...
          --filter=@splitch/control-panel...
          --filter=@splitch/control-plane-api...
          --filter=@splitch/evaluation-api...
          --filter=@splitch/event-ingest-api...
          --filter=@splitch/marketing...
          --filter=@splitch/mcp-server...

      - name: Install Tinybird CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy production
        run: pnpm tinybird:deploy:production

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production deploy"
            echo
            echo "- Ref: \`${GITHUB_SHA}\`"
            echo "- Tinybird: \`tb deploy --check\` then \`tb deploy --wait\` via \`pnpm tinybird:deploy:production\`"
          } >> "$GITHUB_STEP_SUMMARY"
