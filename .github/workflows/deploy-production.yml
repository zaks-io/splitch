name: deploy-production

on:
  workflow_run:
    workflows: ["ci"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  CI: "true"
  SPLITCH_REQUIRE_WORKER_SECRET_ENV: "1"
  SPLITCH_PLATFORM_TARGET: production

jobs:
  validate:
    name: Validate Production Deploy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Validate deploy source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Production deploys must run from main. Current ref: $GITHUB_REF"
              exit 1
            fi
            exit 0
          fi
          test "$WORKFLOW_RUN_CONCLUSION" = "success"
          test "$WORKFLOW_RUN_EVENT" = "push"
          test "$WORKFLOW_RUN_HEAD_BRANCH" = "main"
          test "$WORKFLOW_RUN_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'refs/heads/main' }}
          persist-credentials: false

      - name: Verify checked out CI commit
        if: github.event_name == 'workflow_run'
        env:
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
            echo "::error::checked out $checked_out_sha instead of CI head $WORKFLOW_RUN_HEAD_SHA"
            exit 1
          fi

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Verify manual deploy
        if: github.event_name == 'workflow_dispatch'
        run: pnpm verify:ci

  deploy:
    name: Deploy Production
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: validate
    environment: production
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TB_TOKEN: ${{ secrets.TB_TOKEN }}
      TB_HOST: ${{ vars.TB_HOST }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      ASSERTION_SIGNING_SECRET: ${{ secrets.ASSERTION_SIGNING_SECRET }}
      EVALUATION_PRIVACY_SALT: ${{ secrets.EVALUATION_PRIVACY_SALT }}
      SPLITCH_EVENT_INGEST_TOKEN: ${{ secrets.SPLITCH_EVENT_INGEST_TOKEN }}
      TINYBIRD_COPY_TOKEN: ${{ secrets.TINYBIRD_COPY_TOKEN }}
      TINYBIRD_INGEST_TOKEN: ${{ secrets.TINYBIRD_INGEST_TOKEN }}
      TINYBIRD_READ_TOKEN: ${{ secrets.TINYBIRD_READ_TOKEN }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'refs/heads/main' }}
          persist-credentials: false

      - name: Verify checked out CI commit
        if: github.event_name == 'workflow_run'
        env:
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
            echo "::error::checked out $checked_out_sha instead of CI head $WORKFLOW_RUN_HEAD_SHA"
            exit 1
          fi

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check deploy credentials
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TB_TOKEN TB_HOST ACCESS_TOKEN_SECRET ASSERTION_SIGNING_SECRET EVALUATION_PRIVACY_SALT SPLITCH_EVENT_INGEST_TOKEN TINYBIRD_COPY_TOKEN TINYBIRD_INGEST_TOKEN TINYBIRD_READ_TOKEN TURNSTILE_SECRET WORKOS_CLIENT_ID WORKOS_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for production deploys"
              exit 1
            fi
          done

      - name: Check Turbo remote cache inputs
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Install Tinybird CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tinybird.co | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy production
        run: pnpm deploy:production

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production deploy"
            echo
            echo "- Ref: \`$(git rev-parse HEAD)\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Tinybird: \`pnpm tinybird:deploy:production\`"
            echo "- D1: \`pnpm d1:migrate:production\`"
            echo "- Workers: \`pnpm deploy:cloudflare:production\`"
          } >> "$GITHUB_STEP_SUMMARY"
