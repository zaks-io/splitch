name: deploy-production

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact successful main CI commit to deploy
        required: true
        type: string
      ci_run_id:
        description: Successful main CI run that called this workflow
        required: true
        type: string
      force_full_deploy:
        description: Redeploy every production phase and Worker
        required: false
        type: boolean
        default: false
      allow_stale_release:
        description: Explicitly allow an older successful main commit for recovery
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact successful main CI commit to deploy
        required: false
        type: string
      ci_run_id:
        description: Successful main CI run that dispatched this deploy
        required: false
        type: string
      force_full_deploy:
        description: Redeploy every production phase and Worker
        required: false
        type: boolean
        default: false
      allow_stale_release:
        description: Explicitly allow an older successful main commit for recovery
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  CI: "true"
  SENTRY_RELEASE: ${{ inputs.release_sha || github.sha }}
  SPLITCH_REQUIRE_WORKER_SECRET_ENV: "1"
  SPLITCH_REQUIRE_SENTRY_SOURCE_MAP_ENV: "1"
  SPLITCH_PLATFORM_TARGET: production

jobs:
  validate:
    name: Validate Production Deploy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      d1: ${{ steps.plan.outputs.d1 }}
      reason: ${{ steps.plan.outputs.reason }}
      should_deploy: ${{ steps.freshness.outputs.superseded == 'true' && 'false' || steps.plan.outputs.should_deploy }}
      tinybird: ${{ steps.plan.outputs.tinybird }}
      worker_packages: ${{ steps.plan.outputs.worker_packages }}
      workers: ${{ steps.plan.outputs.workers }}
    steps:
      - name: Validate deploy source
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Reject stale release without explicit recovery
        id: freshness
        env:
          ALLOW_STALE_RELEASE: ${{ inputs.allow_stale_release && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ env.SENTRY_RELEASE }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          current_main_sha="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')"
          if [ "$RELEASE_SHA" = "$current_main_sha" ]; then
            echo "Release is current main: $RELEASE_SHA"
            exit 0
          fi
          if [ "$TRIGGER_EVENT" = "push" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $RELEASE_SHA was superseded by $current_main_sha before deploying; skipping. The CI run for $current_main_sha deploys it."
            {
              echo "## Production deploy plan"
              echo
              echo "- Release: \`$RELEASE_SHA\`"
              echo "- Deploy: \`false\`"
              echo "- Reason: superseded by newer main commit \`$current_main_sha\`; its CI run deploys instead"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ALLOW_STALE_RELEASE" != "1" ]; then
            echo "::error::Release $RELEASE_SHA is not current main $current_main_sha. Dispatch current main or explicitly enable allow_stale_release for recovery."
            exit 1
          fi
          echo "::warning::Explicit stale release recovery enabled: deploying $RELEASE_SHA while current main is $current_main_sha. This does not roll back D1, KV, Durable Objects, Queues, or Tinybird."

      - name: Checkout
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.SENTRY_RELEASE }}
          persist-credentials: false

      - name: Verify checked out release commit
        if: steps.freshness.outputs.superseded != 'true'
        env:
          EXPECTED_SHA: ${{ env.SENTRY_RELEASE }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::checked out $checked_out_sha instead of release commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Verify successful CI for release commit
        if: steps.freshness.outputs.superseded != 'true'
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ env.SENTRY_RELEASE }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER_EVENT" = "push" ]; then
            if [ "$CI_RUN_ID" != "$CURRENT_RUN_ID" ] || [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Reusable production call must deploy this exact CI run and SHA"
              exit 1
            fi
            echo "Verified by successful main CI caller: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
            exit 0
          fi

          runs="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --get \
            --data-urlencode "head_sha=$RELEASE_SHA" \
            --data-urlencode "branch=main" \
            --data-urlencode "event=push" \
            --data-urlencode "status=success" \
            --data-urlencode "per_page=1" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs")"
          run_url="$(jq -r --arg sha "$RELEASE_SHA" \
            '.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success") | .html_url' \
            <<< "$runs" | head -n 1)"
          if [ -z "$run_url" ]; then
            echo "::error::No successful ci push run found for production commit $RELEASE_SHA"
            exit 1
          fi
          echo "Verified CI: $run_url"

      - name: Plan production deploy
        if: steps.freshness.outputs.superseded != 'true'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SPLITCH_FORCE_FULL_DEPLOY: ${{ inputs.force_full_deploy && '1' || '0' }}
        run: node scripts/plan-production-deploy.mjs

      - name: Summary
        if: steps.freshness.outputs.superseded != 'true'
        env:
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          D1: ${{ steps.plan.outputs.d1 }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
          SHOULD_DEPLOY: ${{ steps.plan.outputs.should_deploy }}
          TINYBIRD: ${{ steps.plan.outputs.tinybird }}
          WORKER_PACKAGES: ${{ steps.plan.outputs.worker_packages }}
          WORKERS: ${{ steps.plan.outputs.workers }}
        run: |
          {
            echo "## Production deploy plan"
            echo
            echo "- Baseline: \`${BASE_SHA:-none}\`"
            echo "- Release: \`$SENTRY_RELEASE\`"
            echo "- Deploy: \`$SHOULD_DEPLOY\`"
            echo "- Tinybird: \`$TINYBIRD\`"
            echo "- D1: \`$D1\`"
            echo "- Workers: \`$WORKERS\`"
            echo "- Worker packages: \`${WORKER_PACKAGES:-none}\`"
            echo "- Reason: $PLAN_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Production
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true'
    environment: production
    outputs:
      superseded: ${{ steps.revalidate.outputs.superseded }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TB_TOKEN: ${{ secrets.TB_TOKEN }}
      TB_HOST: ${{ vars.TB_HOST }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      ASSERTION_SIGNING_SECRET: ${{ secrets.ASSERTION_SIGNING_SECRET }}
      CONTROL_PANEL_DELEGATION_SECRET: ${{ secrets.CONTROL_PANEL_DELEGATION_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
      EVALUATION_PRIVACY_SALT: ${{ secrets.EVALUATION_PRIVACY_SALT }}
      EXPOSURE_TICKET_KEY: ${{ secrets.EXPOSURE_TICKET_KEY }}
      MCP_CONTROL_PLANE_DELEGATION_SECRET: ${{ secrets.MCP_CONTROL_PLANE_DELEGATION_SECRET }}
      MCP_EVALUATION_DELEGATION_SECRET: ${{ secrets.MCP_EVALUATION_DELEGATION_SECRET }}
      MCP_ANALYSIS_DELEGATION_SECRET: ${{ secrets.MCP_ANALYSIS_DELEGATION_SECRET }}
      SPLITCH_EVENT_INGEST_TOKEN: ${{ secrets.SPLITCH_EVENT_INGEST_TOKEN }}
      SPLITCH_DEPLOY_GATE_TOKEN: ${{ secrets.SPLITCH_DEPLOY_GATE_TOKEN }}
      TINYBIRD_COPY_TOKEN: ${{ secrets.TINYBIRD_COPY_TOKEN }}
      TINYBIRD_INGEST_TOKEN: ${{ secrets.TINYBIRD_INGEST_TOKEN }}
      TINYBIRD_RUN_SNAPSHOT_TOKEN: ${{ secrets.TINYBIRD_RUN_SNAPSHOT_TOKEN }}
      TINYBIRD_READ_TOKEN: ${{ secrets.TINYBIRD_READ_TOKEN }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      WORKOS_ISSUER: ${{ vars.WORKOS_ISSUER }}
      WORKOS_JWKS_URI: ${{ vars.WORKOS_JWKS_URI }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.SENTRY_RELEASE }}
          persist-credentials: false

      - name: Verify checked out release commit
        env:
          EXPECTED_SHA: ${{ env.SENTRY_RELEASE }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::checked out $checked_out_sha instead of release commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Setup Node
        if: needs.validate.outputs.d1 == 'true' || needs.validate.outputs.workers == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install
        if: needs.validate.outputs.d1 == 'true' || needs.validate.outputs.workers == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check deploy credentials
        env:
          DEPLOY_D1: ${{ needs.validate.outputs.d1 }}
          DEPLOY_TINYBIRD: ${{ needs.validate.outputs.tinybird }}
          DEPLOY_WORKERS: ${{ needs.validate.outputs.workers }}
        run: |
          set -euo pipefail
          required=()
          if [ "$DEPLOY_TINYBIRD" = "true" ]; then
            required+=(TB_TOKEN TB_HOST)
          fi
          if [ "$DEPLOY_D1" = "true" ] || [ "$DEPLOY_WORKERS" = "true" ]; then
            required+=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID)
          fi
          if [ "$DEPLOY_WORKERS" = "true" ]; then
            required+=(ACCESS_TOKEN_SECRET ASSERTION_SIGNING_SECRET CONTROL_PANEL_DELEGATION_SECRET SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT EVALUATION_PRIVACY_SALT EXPOSURE_TICKET_KEY SPLITCH_EVENT_INGEST_TOKEN SPLITCH_DEPLOY_GATE_TOKEN TINYBIRD_COPY_TOKEN TINYBIRD_INGEST_TOKEN TINYBIRD_RUN_SNAPSHOT_TOKEN TINYBIRD_READ_TOKEN TURNSTILE_SECRET WORKOS_CLIENT_ID WORKOS_API_KEY WORKOS_ISSUER WORKOS_JWKS_URI)
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for production deploys"
              exit 1
            fi
          done

      - name: Check Turbo remote cache inputs
        if: needs.validate.outputs.d1 == 'true' || needs.validate.outputs.workers == 'true'
        run: node scripts/check-turbo-remote-cache-env.mjs

      - name: Install Tinybird CLI
        if: needs.validate.outputs.tinybird == 'true'
        timeout-minutes: 5
        uses: ./.github/actions/setup-tinybird-cli

      - name: Revalidate current release after production gate
        id: revalidate
        env:
          ALLOW_STALE_RELEASE: ${{ inputs.allow_stale_release && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ env.SENTRY_RELEASE }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          current_main_sha="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')"
          if [ "$RELEASE_SHA" = "$current_main_sha" ]; then
            echo "Release remains current main: $RELEASE_SHA"
            exit 0
          fi
          if [ "$TRIGGER_EVENT" = "push" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $RELEASE_SHA was superseded by $current_main_sha while waiting for the production gate; skipping. The CI run for $current_main_sha deploys it."
            {
              echo "## Production deploy"
              echo
              echo "- Release: \`$RELEASE_SHA\`"
              echo "- Deploy: \`false\`"
              echo "- Reason: superseded by newer main commit \`$current_main_sha\` at the production gate; its CI run deploys instead"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ALLOW_STALE_RELEASE" != "1" ]; then
            echo "::error::Release $RELEASE_SHA became stale while waiting for the production gate; current main is $current_main_sha."
            exit 1
          fi
          echo "::warning::Production gate approved explicit stale release recovery for $RELEASE_SHA while current main is $current_main_sha."

      - name: Deploy Tinybird
        if: needs.validate.outputs.tinybird == 'true' && steps.revalidate.outputs.superseded != 'true'
        id: tinybird
        run: pnpm tinybird:deploy:production

      - name: Apply D1 migrations
        if: needs.validate.outputs.d1 == 'true' && steps.revalidate.outputs.superseded != 'true'
        id: d1
        run: pnpm d1:migrate:production

      - name: Deploy Cloudflare Workers
        if: needs.validate.outputs.workers == 'true' && steps.revalidate.outputs.superseded != 'true'
        id: workers
        env:
          WORKER_PACKAGES: ${{ needs.validate.outputs.worker_packages }}
        run: node scripts/deploy-cloudflare-workers.mjs production "$WORKER_PACKAGES"

      - name: Summary
        if: always()
        env:
          TINYBIRD_OUTCOME: ${{ steps.tinybird.outcome }}
          D1_OUTCOME: ${{ steps.d1.outcome }}
          PLAN_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          PLAN_REASON: ${{ needs.validate.outputs.reason }}
          WORKERS_OUTCOME: ${{ steps.workers.outcome }}
        run: |
          {
            echo "## Production deploy"
            echo
            echo "- Ref: \`$(git rev-parse HEAD)\`"
            echo "- Release ID: \`$SENTRY_RELEASE\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Baseline: \`$PLAN_BASE_SHA\`"
            echo "- Plan: $PLAN_REASON"
            echo "- Tinybird: \`$TINYBIRD_OUTCOME\`"
            echo "- D1: \`$D1_OUTCOME\`"
            echo "- Workers: \`$WORKERS_OUTCOME\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Track Linear Release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: deploy
    if: needs.deploy.outputs.superseded != 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.SENTRY_RELEASE }}
          persist-credentials: false

      - name: Check Linear release credential
        env:
          LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
        run: |
          if [ -z "$LINEAR_ACCESS_KEY" ]; then
            echo "::error::LINEAR_ACCESS_KEY is required to track platform releases"
            exit 1
          fi

      - name: Sync Linear release
        id: linear-release
        uses: linear/linear-release-action@3858a5d7892435dc63302ac76b0cdb587435caa9 # v0.14.6
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ env.SENTRY_RELEASE }}
          links: |
            GitHub Actions=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Summary
        env:
          LINEAR_RELEASE_URL: ${{ steps.linear-release.outputs.release-url }}
        run: |
          {
            echo "## Linear release"
            echo
            echo "- Release ID: \`$SENTRY_RELEASE\`"
            echo "- Linear: $LINEAR_RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
