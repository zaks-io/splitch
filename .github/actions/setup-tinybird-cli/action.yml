name: Setup Tinybird CLI
description: Install a pinned Tinybird CLI (`tb`) and put it on PATH.

# The Tinybird installer URL always resolves to the latest release, so an
# upstream publish could turn CI or a deploy red with no repo change, and CI
# could validate a different `tb` than the one that deploys minutes later. This
# pins the artifact and gives the version one owner instead of six copies
# drifting apart. uv is installed through a SHA-pinned action at an exact
# version and checked before it installs `tb`. The `tb --version` call at the
# end is the fail-loud proof that the pin actually produced a working binary.

inputs:
  version:
    description: Tinybird CLI version to install.
    required: false
    default: 4.6.14

runs:
  using: composite
  steps:
    - name: Install pinned uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.4"
        enable-cache: false

    - name: Install pinned Tinybird CLI
      shell: bash
      env:
        TINYBIRD_CLI_VERSION: ${{ inputs.version }}
        UV_VERSION: 0.12.4
      run: |
        set -euo pipefail
        uv_version="$(uv --version)"
        case "$uv_version" in
          *" ${UV_VERSION}"*) ;;
          *)
            echo "::error::uv reports '${uv_version}', expected ${UV_VERSION}"
            exit 1
            ;;
        esac
        uv tool install --force --python 3.11 "tinybird==${TINYBIRD_CLI_VERSION}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        tb --no-version-warning --version
