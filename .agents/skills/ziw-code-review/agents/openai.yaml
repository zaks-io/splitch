interface:
  display_name: "Code Review"
  short_description: "Review code changes"
  default_prompt: "Use $ziw-code-review with an explicit review target (--pr, --branch, or --range) when explicitly requested, deliberately selected as judgment-based Author QA, or dispatched as independent Agent Review. Resolve the target with scripts/resolve-review-target.mjs and never infer it from the working directory or checked-out branch; stop and ask when no target was given. Do not auto-trigger solely because a commit or PR changed. Submit GitHub results only when --submit is explicit. Treat implementation-workflow review as Author QA, leave review evidence unchanged, and never mutate tracker or merge-ready labels."
policy:
  allow_implicit_invocation: true
